# Caddy obtains and renews the certificate itself, which needs ears_domain to
# resolve to this machine and ports 80 and 443 open to the internet.
- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: present

- name: Write the Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    mode: "0644"
    validate: caddy validate --adapter caddyfile --config %s
  notify: Reload Caddy

- name: Start Caddy
  ansible.builtin.systemd_service:
    name: caddy
    enabled: true
    state: started
