# Each listener host needs ears_room set in the inventory: the room's id,
# lowercase letters, digits, hyphens and underscores. The rest are optional.
ears_room_title: "{{ ears_room }}"
ears_track: ""
ears_language: en
# Capture device and channel, as shown by `ears-listener --list-devices`.
# Empty means the system default input and the loudest channel.
ears_device: ""
ears_channel: ""

# parakeet (sherpa-onnx, on the processor) or whisper (whisper.cpp, Vulkan).
ears_backend: parakeet
# parakeet-tdt-0.6b-v3-int8 covers 25 European languages; v2 is English only.
ears_parakeet_model: parakeet-tdt-0.6b-v2-int8
ears_sherpa_threads: 6
ears_whisper_model: medium.en-q5_0

# Any other listener.yaml settings, such as min_rms or silence_ms, as a
# mapping that is written into the file as it stands.
ears_listener_extra: {}
