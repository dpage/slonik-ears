# An example event: one relay server and two rooms. Copy this directory to
# inventory/<event>/ (which git ignores) and edit the copy.
all:
  children:
    ears_server:
      hosts:
        relay:
          ansible_host: 192.0.2.10
    ears_listeners:
      hosts:
        room-a:
          ansible_host: 192.0.2.21
          ears_room: main-hall
          ears_room_title: Main Hall
          ears_track: Track A
        room-b:
          ansible_host: 192.0.2.22
          ears_room: seminar-1
          ears_room_title: Seminar Room 1
          ears_track: Track B
          ears_device: USB Audio
