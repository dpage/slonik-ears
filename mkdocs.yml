site_name: Slonik Ears
site_description: Live transcription for multi-track events.
site_url: https://dpage.github.io/slonik-ears/
site_author: Dave Page

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - meta
  - pymdownx.details
  - pymdownx.superfences
  - tables

plugins:
  - search

theme:
  name: material
  custom_dir: docs/overrides
  favicon: img/favicon.svg

  logo_dark_mode: 'img/logo-dark.svg'
  logo_light_mode: 'img/logo-light.svg'

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.prune
    - navigation.top
    - toc.follow

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra:
  generator: false

copyright: Copyright &copy; 2026 Dave Page
repo_url: https://github.com/dpage/slonik-ears

nav:
  - Getting Started:
      - Introduction: index.md
      - Architecture: architecture.md
      - Quick Start: quick_start.md

  - Running an Event:
      - Event Checklist: running_an_event.md
      - Installing: installing.md
      - Choosing a Model: models.md
      - Capturing Audio: audio.md
      - Running the Server: server.md
      - Running a Listener: listener.md
      - Managing Rooms: rooms.md

  - Reference:
      - Listener Options: listener_reference.md
      - Server Options: server_reference.md
      - HTTP API: api.md
      - Tuning Transcription: tuning.md

  - Support:
      - Troubleshooting: troubleshooting.md
      - Accessibility: accessibility.md
      - FAQ: faq.md
      - Developer Resources: developers.md

  - Changelog: changelog.md
  - License: LICENSE.md
