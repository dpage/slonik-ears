# Keep dependencies current without anybody having to remember to look.
#
# Grouped so that a quiet week produces one pull request rather than nine.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      # React and friends move together; so does the build tooling.
      react:
        patterns: ['react', 'react-dom', 'react-router-dom', '@types/react*']
      build-tooling:
        patterns: ['vite', '@vitejs/*', 'typescript', '@types/node', 'playwright']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/London
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/London
