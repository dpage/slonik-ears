name: CI

# Documentation cannot break the Go tests, the web application or the end to
# end run, so a change touching nothing else skips all of it and docs.yml
# picks it up instead. The filter is an exclusion rather than an inclusion on
# purpose: a path nobody thought to list runs the full suite, which is the
# safe direction in which to be wrong.
#
# The filter applies to the change as a whole, so a commit touching both a
# Markdown file and a Go file still runs everything. The two lists are
# duplicated because GitHub does not support YAML anchors in a workflow.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Least privilege by default; the jobs that need more ask for it themselves.
permissions:
  contents: read

# A new push to a pull request makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal web)
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The pinned release must have been built with a Go at least as new as
      # the one go.mod targets, or it refuses to load the config. v2.13.2 is
      # built with go1.27.0; bump this in step with the toolchain in go.mod.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Linux is where the server runs; macOS is where the listener runs and
        # the only place the CoreAudio capture path is compiled at all.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with the race detector
        run: go test -race -count=1 ./...

      - name: Build both binaries
        run: |
          CGO_ENABLED=0 go build ./cmd/ears-server
          CGO_ENABLED=1 go build ./cmd/ears-listener

  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm audit
        working-directory: web
        # Advisories in build-time tooling do not ship to attendees, so this
        # reports without failing the build; production dependencies do fail.
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm audit || true

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Type check and build
        working-directory: web
        run: npm run build

      - name: Unit tests
        working-directory: web
        run: npm test

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  end-to-end:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test, web]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Fetch the built web app
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Build the binaries
        run: |
          CGO_ENABLED=0 go build -o /tmp/ears-server ./cmd/ears-server
          CGO_ENABLED=0 go build -o /tmp/ears-listener ./cmd/ears-listener

      - name: Publish a transcript through a real server
        run: |
          set -euo pipefail
          EARS_PUBLISH_TOKEN=ci-token EARS_EVENT_NAME="CI" \
            /tmp/ears-server --addr 127.0.0.1:18080 --data-dir /tmp/ears-data &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:18080/healthz >/dev/null && break
            sleep 0.25
          done

          /tmp/ears-listener --room ci --title "CI Room" --track "CI" \
            --server http://127.0.0.1:18080 --token ci-token \
            --mock --file testdata/sample.wav --fast

          transcript=$(curl -sf "http://127.0.0.1:18080/api/rooms/ci/transcript?format=txt")
          echo "$transcript"
          echo "$transcript" | grep -q "replication" \
            || { echo "::error::the transcript did not reach the server"; exit 1; }

          curl -sf http://127.0.0.1:18080/ | grep -q '<div id="root">' \
            || { echo "::error::the web app was not embedded in the binary"; exit 1; }

      - name: Install the browser for the smoke test
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: |
          set -euo pipefail
          EARS_PUBLISH_TOKEN=ci-token EARS_EVENT_NAME="CI" \
            /tmp/ears-server --addr 127.0.0.1:18081 &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:18081/healthz >/dev/null && break
            sleep 0.25
          done
          # Seed enough transcript that the view has to scroll, then leave a
          # listener running in real time so new lines keep arriving.
          timeout 20 /tmp/ears-listener --room smoke --title "Smoke Room" --track "CI" \
            --server http://127.0.0.1:18081 --token ci-token \
            --mock --file testdata/sample.wav --loop --fast || true
          /tmp/ears-listener --room smoke --title "Smoke Room" --track "CI" \
            --server http://127.0.0.1:18081 --token ci-token \
            --mock --file testdata/sample.wav --loop &
          sleep 4
          node web/e2e/smoke.mjs http://127.0.0.1:18081 smoke

      - name: Keep the screenshots when something looks wrong
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: web/e2e/output
          retention-days: 7
          if-no-files-found: ignore
