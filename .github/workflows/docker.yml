name: Container image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'deploy/Dockerfile'
      - '.github/workflows/docker.yml'
      - 'go.mod'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  verify:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Single architecture, loaded into the local daemon, so the image can
      # actually be run. A multi-architecture image cannot be loaded, which is
      # why publishing is a separate job.
      - name: Build for this runner
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: slonik-ears:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run it and check it serves the app
        run: |
          set -euo pipefail
          docker run --rm -d --name ears-smoke -p 8080:8080 \
            -e EARS_PUBLISH_TOKEN=smoke slonik-ears:ci
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 0.25
          done
          curl -sf http://127.0.0.1:8080/healthz
          curl -sf http://127.0.0.1:8080/ | grep -q '<div id="root">' \
            || { echo "::error::the image does not serve the web app"; exit 1; }
          # It must not be running as root: this listens on a public network.
          test "$(docker exec ears-smoke id -u)" != "0" \
            || { echo "::error::the image runs as root"; exit 1; }
          docker stop ears-smoke

  publish:
    name: Publish to GHCR
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          # The server is pure Go and cross-compiles inside the build stage,
          # so arm64 costs almost nothing here: no QEMU is involved.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
