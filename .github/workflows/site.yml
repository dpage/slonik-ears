name: Site

# Builds the documentation and the apt repository into one GitHub Pages
# site. Only the documentation and the apt tooling trigger it: a change to
# the Go code or the web application cannot alter the rendered site, so
# rebuilding and republishing it for one would be work nobody asked for.
# release.yml starts it by hand after publishing a release, which is how a new
# release reaches the apt repository.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'packaging/apt/**'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'packaging/apt/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

# Least privilege by default; the deploy job asks for what it needs.
permissions:
  contents: read

# A new push to a pull request makes the previous run pointless, but a deploy
# already under way is left to finish rather than being cancelled part done.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install
        run: pip install -r requirements-docs.txt

      # --strict turns a broken link or a page missing from the navigation
      # into a failure, which is the whole reason to build this on a pull
      # request rather than discovering it after publication.
      - name: Build
        run: mkdocs build --strict

      # The repository holds every stable release, newest first, so that
      # where two releases carry a file of the same name (whisper-server does)
      # the newest copy is the one that is kept. Pull requests skip this: they
      # prove the docs build and have no business holding the signing key.
      - name: Build the apt repository
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          # List first, into a variable, so that a failed call stops the step
          # instead of looking like a repository with no releases.
          tags=$(gh release list --exclude-pre-releases --exclude-drafts \
            --limit 100 --json tagName -q '.[].tagName')
          # A release without a .deb (v1.0.0 has none) makes `gh release
          # download` fail, so only ask releases that carry one.
          mkdir debs
          found=0
          for tag in $tags; do
            count=$(gh release view "$tag" --json assets \
              --jq '[.assets[].name | select(endswith(".deb"))] | length')
            if [ "$count" -gt 0 ]; then
              found=1
              break
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::warning::No stable release has a .deb yet; publishing the docs without the apt repository"
            exit 0
          fi
          # Every Pages deployment replaces the whole site, so from here on
          # going ahead without the repository would take it offline.
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::error::APT_SIGNING_KEY is not set, but a stable release has a .deb; refusing to deploy a site without /apt/"
            exit 1
          fi
          for tag in $tags; do
            count=$(gh release view "$tag" --json assets \
              --jq '[.assets[].name | select(endswith(".deb"))] | length')
            if [ "$count" -gt 0 ]; then
              gh release download "$tag" -p '*.deb' -D debs --skip-existing
            fi
          done
          packaging/apt/build-repo.sh debs site/apt
          size=$(du -sm site | cut -f1)
          if [ "$size" -gt 800 ]; then
            echo "::warning::The site is ${size} MB; GitHub Pages limits it to 1 GB"
          fi

      - name: Upload for deployment
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish
    # Only what is already on main gets published; a pull request is built to
    # prove it works, not to change the public site.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
