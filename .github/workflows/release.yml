name: Release

on:
  push:
    tags: ['v*']
  # Runs on demand too, so the packaging can be exercised without cutting a
  # release; only a tag actually publishes one.
  workflow_dispatch:
  # A pull request that changes the packaging runs everything but the publish
  # job, so the .debs are built and install-tested before it merges.
  pull_request:
    paths: ['packaging/**', '.github/workflows/release.yml']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Kept in step with ci.yml and the `node:` tag in deploy/Dockerfile, so the
  # web application is released from the version it was tested on.
  NODE_VERSION: '26'

jobs:
  web:
    name: Build the web app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist

  server:
    name: Server (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The server has no cgo, so every one of these cross-compiles from a
        # single Linux runner.
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch the built web app
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          case "$GITHUB_REF_TYPE" in tag) ;; *) version="dev-${GITHUB_SHA::7}" ;; esac
          mkdir -p out
          go build -trimpath \
            -ldflags "-s -w -X github.com/dpage/slonik-ears/internal/version.Version=${version} -X github.com/dpage/slonik-ears/internal/version.Commit=${GITHUB_SHA::7}" \
            -o "out/ears-server${{ matrix.ext }}" ./cmd/ears-server

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          case "$GITHUB_REF_TYPE" in tag) ;; *) version="dev-${GITHUB_SHA::7}" ;; esac
          name="slonik-ears-server-${version}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "dist/${name}"
          cp "out/ears-server${{ matrix.ext }}" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          cp configs/server.example.yaml "dist/${name}/"
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -qr "${name}.zip" "${name}"
          else
            tar -czf "${name}.tar.gz" "${name}"
          fi
          rm -rf "${name}"

      - name: Debian package
        if: matrix.goos == 'linux'
        env:
          ARCH: ${{ matrix.goarch }}
          BINARY: out/ears-server
        run: |
          set -euo pipefail
          VERSION="$(packaging/deb-version.sh "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_SHA")"
          export VERSION
          sed 's#data_dir: "./data"#data_dir: "/var/lib/slonik-ears"#' \
            configs/server.example.yaml > packaging/server/server.yaml
          grep -q 'data_dir: "/var/lib/slonik-ears"' packaging/server/server.yaml
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          "$(go env GOPATH)/bin/nfpm" package --config packaging/server/nfpm.yaml --packager deb --target dist/

      - uses: actions/upload-artifact@v7
        with:
          name: package-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  listener:
    name: Listener (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The listener needs cgo for audio capture, so each target is built on
        # its own native runner rather than cross-compiled.
        include:
          - { os: macos-latest, label: darwin-arm64 }
          - { os: macos-15-intel, label: darwin-amd64 }
          - { os: ubuntu-latest, label: linux-amd64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          case "$GITHUB_REF_TYPE" in tag) ;; *) version="dev-${GITHUB_SHA::7}" ;; esac
          mkdir -p out
          go build -trimpath \
            -ldflags "-s -w -X github.com/dpage/slonik-ears/internal/version.Version=${version} -X github.com/dpage/slonik-ears/internal/version.Commit=${GITHUB_SHA::7}" \
            -o out/ears-listener ./cmd/ears-listener
          ./out/ears-listener --version

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          case "$GITHUB_REF_TYPE" in tag) ;; *) version="dev-${GITHUB_SHA::7}" ;; esac
          name="slonik-ears-listener-${version}-${{ matrix.label }}"
          mkdir -p "dist/${name}"
          cp out/ears-listener "dist/${name}/"
          cp README.md LICENSE docs/running_an_event.md "dist/${name}/"
          cp configs/listener.example.yaml "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          rm -rf "dist/${name}"

      - uses: actions/upload-artifact@v7
        with:
          name: package-listener-${{ matrix.label }}
          path: dist/*

  deb-listener:
    name: Listener (Debian package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Built in trixie so that the cgo binary links against the libraries the
    # package depends on.
    container: golang:1.27-trixie
    steps:
      - uses: actions/checkout@v7

      - name: Install the build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libasound2-dev libpulse-dev pkg-config

      - name: Build
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          case "$GITHUB_REF_TYPE" in tag) ;; *) version="dev-${GITHUB_SHA::7}" ;; esac
          mkdir -p out
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X github.com/dpage/slonik-ears/internal/version.Version=${version} -X github.com/dpage/slonik-ears/internal/version.Commit=${GITHUB_SHA::7}" \
            -o out/ears-listener ./cmd/ears-listener
          ./out/ears-listener --version

      - name: Package
        env:
          BINARY: out/ears-listener
        run: |
          set -euo pipefail
          VERSION="$(packaging/deb-version.sh "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_SHA")"
          export VERSION
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          mkdir -p dist
          "$(go env GOPATH)/bin/nfpm" package --config packaging/listener/nfpm.yaml --packager deb --target dist/

      - uses: actions/upload-artifact@v7
        with:
          name: package-deb-listener
          path: dist/*.deb

  deb-whisper:
    name: whisper-server (Debian package)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7

      # Keyed on everything that changes the build, so a cache hit only ever
      # skips work that would produce the same result.
      - uses: actions/cache@v6
        with:
          path: .whisper-work
          key: whisper-server-${{ hashFiles('packaging/whisper-server/**', 'packaging/install-nfpm.sh') }}

      # build.sh reuses the whisper.cpp checkout and build it finds in WORK.
      # GITHUB_WORKSPACE, unlike github.workspace, is the path inside the
      # container.
      - name: Build
        run: WORK="$GITHUB_WORKSPACE/.whisper-work" packaging/whisper-server/build.sh dist

      - uses: actions/upload-artifact@v7
        with:
          name: package-deb-whisper
          path: dist/*.deb

  deb-test:
    name: Install-test the Debian packages
    needs: [server, deb-listener, deb-whisper]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7

      - name: Collect the packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: debs
          merge-multiple: true

      - name: Test
        run: packaging/test-install.sh debs

  publish:
    name: Publish the release
    needs: [server, listener, deb-listener, deb-whisper, deb-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only a tag publishes. A manual run stops after building the packages,
    # which are kept as workflow artifacts for inspection.
    if: github.ref_type == 'tag'
    permissions:
      contents: write
      # To start site.yml, which adds the new packages to the apt repository.
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Collect every package
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          ls -la
          sha256sum ./*.tar.gz ./*.zip ./*.deb | tee SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          ### Which download do I want?

          * **`server`** runs the relay and serves the attendee web app. It has
            no dependencies at all: copy the binary to a host and run it. The
            web app is embedded inside it.
          * **`listener`** runs in a room, captures the audio and publishes the
            transcript. It needs a Whisper backend alongside it; see the
            README for `brew install whisper-cpp`.

          Verify a download against `SHA256SUMS` before running it.
          NOTES

          # Prereleases never enter the apt repository, so do not point a
          # smoke tester at it.
          case "${GITHUB_REF_NAME}" in
            *-*) ;;
            *) cat >> notes.md <<'NOTES'

          On Debian 13 (trixie), install from the apt repository instead,
          which also brings in `whisper-server` and keeps everything up to
          date with `apt upgrade`: see
          [Installing on Debian](https://dpage.github.io/slonik-ears/debian/).
          The `.deb` files attached here are the same packages.
          NOTES
              ;;
          esac

          # A tag carrying a suffix (v1.0.0-rc1, -beta2, -alpha1) is a
          # candidate handed to whoever is smoke testing it, not something to
          # put in front of the world as the current release. Without this a
          # release candidate publishes as the latest full release, which is
          # the one mistake in this workflow that cannot be taken back
          # quietly.
          flags=()
          case "${GITHUB_REF_NAME}" in
            *-*) flags+=(--prerelease) ;;
          esac

          gh release create "${GITHUB_REF_NAME}" \
            --title "Slonik Ears ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --generate-notes \
            "${flags[@]}" \
            dist/*

          # Rebuild the site, which adds this release's packages to the apt
          # repository. Prereleases never enter it, so they need no rebuild.
          # The release exists by now and cannot be created again, so a
          # failure here must not turn this run red.
          case "${GITHUB_REF_NAME}" in
            *-*) ;;
            *) gh workflow run site.yml --ref main ||
                 echo "::warning::Could not start the Site workflow; run it by hand to publish this release to the apt repository" ;;
          esac
