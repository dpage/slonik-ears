// Configuration for apt-ftparchive, used by build-repo.sh, which runs it from
// the output directory so that every path below is relative to that.
Dir {
  ArchiveDir ".";
  CacheDir ".";
};

Default {
  Packages::Compress ". gzip";
  Contents::Compress "gzip";
};

// Scans pool/ for .debs and writes dists/stable/main/binary-<arch>/Packages.
TreeDefault {
  Directory "pool/$(SECTION)";
};

Tree "dists/stable" {
  Sections "main";
  Architectures "amd64 arm64";
};

APT::FTPArchive::Release {
  Origin "Slonik Ears";
  Label "Slonik Ears";
  Suite "stable";
  Codename "stable";
  Architectures "amd64 arm64";
  Components "main";
};
