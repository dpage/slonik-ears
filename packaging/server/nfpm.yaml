# nfpm config for the server package. Run from the repository root with
# VERSION, ARCH and BINARY set, and packaging/server/server.yaml generated
# from configs/server.example.yaml (see .github/workflows/release.yml).
name: slonik-ears-server
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Dave Page <dpage@pgadmin.org>
description: |-
  Slonik Ears transcript server
   Receives transcripts from listeners, stores them and serves the web
   interface.
homepage: https://github.com/dpage/slonik-ears
license: PostgreSQL

# preinstall.sh runs adduser before the package's own dependencies are
# configured, and policy only guarantees Pre-Depends to a preinst.
deb:
  predepends:
    - adduser

contents:
  - src: ${BINARY}
    dst: /usr/bin/ears-server
    expand: true
    file_info:
      mode: 0755
  - src: packaging/server/server.yaml
    dst: /etc/slonik-ears/server.yaml
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: slonik-ears
  - src: packaging/server/slonik-ears-server.service
    dst: /usr/lib/systemd/system/slonik-ears-server.service
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/slonik-ears-server/README.md
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/slonik-ears-server/LICENSE
    file_info:
      mode: 0644

scripts:
  preinstall: packaging/server/preinstall.sh
  postinstall: packaging/server/postinstall.sh
