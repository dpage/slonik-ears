# nfpm config for the sherpa-onnx-server package. Run by build.sh from the
# repository root with STAGE (the extracted binary), LICENSE_FILE (the
# downloaded licence) and DEB_VERSION set.
name: sherpa-onnx-server
arch: amd64
platform: linux
version: ${DEB_VERSION}
# DEB_VERSION already carries the Debian revision; without this nfpm would
# read -0slonik1 as a semver prerelease and turn it into ~0slonik1.
version_schema: none
section: sound
priority: optional
maintainer: Dave Page <dpage@pgadmin.org>
description: |-
  sherpa-onnx speech recognition server for Slonik Ears
   sherpa-onnx's offline WebSocket server, prebuilt and statically linked
   with onnxruntime, for running NVIDIA Parakeet models on the processor.
homepage: https://github.com/k2-fsa/sherpa-onnx
license: Apache-2.0

# The packages build.sh reports for the libraries ldd finds.
depends:
  - libc6

contents:
  - src: ${STAGE}/sherpa-onnx-offline-websocket-server
    dst: /usr/lib/slonik-ears/sherpa-onnx/sherpa-onnx-offline-websocket-server
    expand: true
    file_info:
      mode: 0755
  - src: /usr/lib/slonik-ears/sherpa-onnx/sherpa-onnx-offline-websocket-server
    dst: /usr/bin/sherpa-onnx-offline-websocket-server
    type: symlink
  - src: packaging/sherpa-onnx-server/check-model.sh
    dst: /usr/lib/slonik-ears/sherpa-onnx/check-model
    file_info:
      mode: 0755
  - src: packaging/sherpa-onnx-server/sherpa-onnx-server.default
    dst: /etc/default/sherpa-onnx-server
    type: config|noreplace
    file_info:
      mode: 0644
  - src: packaging/sherpa-onnx-server/sherpa-onnx-server.service
    dst: /usr/lib/systemd/system/sherpa-onnx-server.service
    file_info:
      mode: 0644
  # Root-owned: models are fetched with sudo, and the service's dynamic user
  # only reads them.
  - dst: /var/lib/sherpa-onnx-server/models
    type: dir
    file_info:
      mode: 0755
      owner: root
      group: root
  - src: ${LICENSE_FILE}
    dst: /usr/share/doc/sherpa-onnx-server/copyright
    expand: true
    file_info:
      mode: 0644

scripts:
  postinstall: packaging/sherpa-onnx-server/postinstall.sh
